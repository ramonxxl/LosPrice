name: Build e Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Calcular a versão semântica desta build
        # MAJOR.MINOR vêm do arquivo VERSION (versionado no repositório,
        # ajustado à mão quando uma mudança realmente merece um novo
        # major/minor); PATCH é o número sequencial da própria Action,
        # então toda build gera uma versão nova e única sem precisar
        # editar o VERSION a cada push.
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $versao = "$base.${{ github.run_number }}"
          "VERSAO=$versao" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path assets\versao.txt -Value $versao -NoNewline -Encoding utf8

      - name: Conferir o motor de cálculo
        # O motor roda sem interface, então dá para validá-lo no CI.
        # Se a matemática quebrar, a build falha antes de virar release.
        run: python core/calculo.py

      - name: Gerar o executável (PyInstaller)
        run: python -m PyInstaller LosPrice.spec --clean --noconfirm

      - name: Conferir que o executável saiu
        run: |
          if (-not (Test-Path "dist\LosPrice\LosPrice.exe")) {
            throw "O executavel nao foi gerado."
          }

      - name: Compactar a build
        run: Compress-Archive -Path dist\LosPrice\* -DestinationPath LosPrice.zip

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: "LosPrice — v${{ env.VERSAO }}"
          body: |
            Build automática gerada a partir do commit ${{ github.sha }}.

            **Como instalar:** baixe o `LosPrice.zip`, extraia a pasta onde
            quiser e execute `LosPrice.exe`. Não precisa ter Python instalado.

            Os dados ficam em `dados/`, `backups/` e `relatorios/`, ao lado do
            executável. Para atualizar, substitua os arquivos do programa e
            mantenha essas três pastas.
          files: LosPrice.zip
